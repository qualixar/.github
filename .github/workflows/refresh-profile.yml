name: Refresh org profile README

# Rebuilds profile/README.md from data/products.json with live stars,
# releases and download counts. Badges are live between runs anyway; this
# run moves products between tiers, updates totals and the hero image counts.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  push:
    branches: [main]
    paths: [data/products.json, scripts/build_readmes.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the builder
        run: python -m unittest discover tests -v
      - name: Build README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readmes.py --org profile/README.md
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "qualixar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md data/stats.json assets/qualixar-readme-hero.svg
          git commit -m "chore: refresh profile README stats"
          git push
